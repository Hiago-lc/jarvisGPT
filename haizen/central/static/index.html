<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central HAIZEN</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone-192.png">
<meta name="theme-color" content="#0B1D23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
</head>
<body>
<aside class="trilho" aria-label="Navegação">
  <a class="marca" href="#/painel" aria-label="Central HAIZEN, ir para o painel">
    <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="5" fill="#16323B"/>
      <path d="M7 27 10.5 9h4l-1.4 7h5.2L19.7 9h-2.5L22 3.5 26 9h-2.3L20 27h-4l1.5-7.4h-5.2L10.8 27z" fill="#F2F5F4"/>
      <path d="M22 3.5 26 9h-2.3L20 27h-4" fill="#9BC53D"/>
    </svg>
    <span class="marca-nome">HAIZEN</span>
  </a>
  <nav aria-label="Telas">
    <a href="#/jarvis" data-rota="jarvis" class="nav-jarvis"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg><span>Jarvis</span><span class="nav-estado" id="nav-estado" hidden></span></a>
    <div class="nav-grupo">
      <a href="#/painel" data-rota="painel"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Painel</span></a>
      <a href="#/agenda" data-rota="agenda"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 10h16M8 3v4M16 3v4M8 14h3v3H8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Agenda</span></a>
      <a href="#/financeiro" data-rota="financeiro"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Financeiro</span></a>
      <a href="#/clientes" data-rota="clientes"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM2.5 20c.6-3.3 3.3-5.5 6.5-5.5s5.9 2.2 6.5 5.5M16 4.3a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.8 3.2 2.6 3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Clientes</span></a>
      <a href="#/tarefas" data-rota="tarefas"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Tarefas</span></a>
      <a href="#/pipeline" data-rota="pipeline"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Pipeline</span></a>
      <a href="#/escritorio" data-rota="escritorio"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20v-6h14v6M7 14V9h6v5M10 9V6M15.5 11.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Escritório</span></a>
      <a href="#/agentes" data-rota="agentes"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l3 5-7 11L5 9z M5 9h14 M12 20 9.5 9 12 4l2.5 5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Agentes</span> <span class="selo" id="selo-agentes" hidden></span></a>
      <a href="#/whatsapp" data-rota="whatsapp"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9.5c.3 1.9 1.6 3.7 3.5 4.6l1.2-1 1.8.9-.4 1.5c-3 .2-6.2-2.9-6.3-6l1.4-.6 1 1.6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>WhatsApp</span></a>
    </div>
  </nav>
  <div class="trilho-sistema" id="sistema" hidden>
    <button type="button" class="mic-pilula" id="mic-global" aria-pressed="true"><span class="mic-ponto" aria-hidden="true"></span><span id="mic-global-rotulo">Microfone ligado</span></button>
    <button type="button" class="trilho-botao" id="abrir-ajustes" hidden><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ajustes</span></button>
  </div>
  <p class="trilho-rodape">Dados neste computador</p>
</aside>

<div class="versao" id="versao" role="status" hidden>
  <span>Há uma versão nova do Jarvis instalada neste PC. Reinicie para usar.</span>
  <button class="botao primario" type="button" id="versao-reiniciar">Reiniciar agora</button>
</div>

<main id="conteudo" tabindex="-1">
  <p class="carregando">Carregando…</p>
</main>

<dialog id="dialogo">
  <form method="dialog" id="dialogo-form">
    <header class="dialogo-topo">
      <h2 id="dialogo-titulo"></h2>
      <button type="button" class="botao-icone" data-fechar aria-label="Fechar">✕</button>
    </header>
    <div id="dialogo-corpo"></div>
    <p class="erro" id="dialogo-erro" role="alert" hidden></p>
    <footer class="dialogo-acoes" id="dialogo-acoes"></footer>
  </form>
</dialog>

<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
