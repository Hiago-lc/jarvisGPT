<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- MODELO: capa de carrossel (feed 1080x1350). Quando usar: conteúdo educativo, lista, "erros", "passos".
     Troque: gancho (promessa ou curiosidade em até 8 palavras), número, cores. As lâminas internas seguem a MESMA grade e
     paleta, com o número da lâmina no canto e uma ideia por lâmina. Última lâmina: CTA (salvar/comentar/chamar).
     Ideia: tipografia como imagem; contraste extremo; seta indicando o deslize. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/haizen-kit.css">
<style>
  :root { --fundo: #d4ff3a; --tinta: #0e0e0e; --suave: rgba(14,14,14,.6); --destaque: #0e0e0e; }
  .n { font: 900 520px/.72 var(--fonte-titulo); letter-spacing: -.09em; position: absolute; right: -3%; bottom: 7%; color: var(--tinta); opacity: .07; }
  .deslize { width: 108px; height: 108px; border-radius: 50%; background: var(--tinta); color: var(--fundo); display: grid; place-items: center; font: 800 52px/1 var(--fonte-titulo); }
</style></head>
<body><div class="peca grao">
  <div class="n">3</div>
  <div class="area">
    <div class="fila entre"><span class="sobre">Branding</span><img class="logo" src="logo.png" alt=""></div>
    <h1 class="display d-xl" style="margin-top:auto">3 sinais de que sua marca parece <span class="sublinhado" style="--destaque:#fff">amadora</span></h1>
    <div class="fila entre" style="margin-top:56px"><p class="texto" style="max-width:520px;color:var(--suave)">E como resolver cada um sem refazer tudo.</p><span class="deslize">→</span></div>
  </div>
</div></body></html>
