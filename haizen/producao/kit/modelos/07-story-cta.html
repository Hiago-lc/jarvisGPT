<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- MODELO: story / anúncio vertical (1080x1920). Quando usar: stories, reels estáticos, anúncio 9:16.
     Troque: foto de tela cheia, título, CTA. Tudo importante fica DENTRO de .area.story (zonas seguras 250 px topo / 350 px base).
     Ideia: foto imersiva + bloco de vidro com a mensagem; CTA grande e fácil de tocar. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/haizen-kit.css">
<style>
  :root { --fundo: #0b0c10; --tinta: #fff; --destaque: #ffd23f; }
  .bloco { padding: 54px 50px; margin-top: auto; }
</style></head>
<body><div class="peca">
  <img class="foto" src="foto.jpg" alt=""><div class="veu-baixo"></div>
  <div class="area story" style="z-index:2">
    <img class="logo" src="logo.png" alt="" style="align-self:flex-start">
    <div class="vidro bloco">
      <p class="sobre" style="color:var(--destaque)">Vagas abertas · Dezembro</p>
      <h1 class="display d-l" style="margin:24px 0 26px">Maragogi com tudo incluso.</h1>
      <p class="texto" style="color:rgba(255,255,255,.82)">Aéreo, hotel pé na areia e passeios. Parcelado em até 10x.</p>
      <span class="cta" style="margin-top:40px">Quero meu orçamento <span class="seta">→</span></span>
    </div>
  </div>
</div></body></html>
