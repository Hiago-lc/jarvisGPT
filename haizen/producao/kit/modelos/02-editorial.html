<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- MODELO: editorial (feed 1080x1350). Quando usar: serviços premium, estética, arquitetura, moda, autoridade.
     Troque: foto.jpg (pessoa/ambiente real do cliente), título em serifa com 1 palavra em itálico, linha fina, assinatura.
     Ideia: cara de revista — muito respiro, serifa elegante, foto em moldura com proporção forte. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/haizen-kit.css">
<style>
  :root { --fundo: #f4efe8; --tinta: #1d1a17; --suave: rgba(29,26,23,.62); --destaque: #8a5a3c; }
  .moldura { position: absolute; right: var(--margem); top: 15%; width: 47%; height: 62%; border-radius: 260px 260px 18px 18px; }
  .esq { position: absolute; left: var(--margem); top: 15%; width: 42%; }
  .serif.grande { font-size: 92px; line-height: .98; }
  .num { font: 600 20px/1 var(--fonte-texto); letter-spacing: .2em; color: var(--suave); }
</style></head>
<body><div class="peca grao">
  <div class="area"><div class="fila entre"><span class="num">01 — MÉTODO</span><img class="logo" src="logo.png" alt=""></div></div>
  <div class="esq">
    <h1 class="serif grande">Pele que <span class="italico" style="color:var(--destaque)">respira</span> de novo.</h1>
    <div class="linha" style="margin:44px 0 32px;width:120px;background:var(--tinta)"></div>
    <p class="texto" style="font-size:28px">Protocolo em 3 sessões, com avaliação gratuita na primeira visita.</p>
  </div>
  <div class="moldura"><img src="foto.jpg" alt=""></div>
  <div class="area"><div class="empurra fila entre"><span class="sobre" style="color:var(--suave)">Agende pelo WhatsApp</span><span class="sobre">@suamarca</span></div></div>
</div></body></html>
