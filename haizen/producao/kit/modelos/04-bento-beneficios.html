<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- MODELO: bento de benefícios (feed 1080x1350). Quando usar: SaaS, serviços, produto com 3–4 diferenciais.
     Troque: título, cartões (1 número/benefício forte por cartão), foto no cartão grande.
     Ideia: grade "bento" moderna; um cartão dominante; números grandes. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/haizen-kit.css">
<style>
  :root { --fundo: #f3f4f1; --tinta: #121417; --suave: rgba(18,20,23,.6); --marca: #1f6f5c; --destaque: #1f6f5c; }
  .grade { position: absolute; left: var(--margem); right: var(--margem); top: 33%; bottom: var(--margem);
    display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 18px; }
  .c { background: #fff; border-radius: 30px; padding: 30px 32px; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 24px 48px -32px rgba(0,0,0,.25); }
  .c.foto-c { grid-row: span 3; padding: 0; overflow: hidden; position: relative; }
  .c.foto-c img { width: 100%; height: 100%; object-fit: cover; }
  .c.cor { background: var(--marca); color: #fff; }
  .big { font: 800 76px/1 var(--fonte-titulo); letter-spacing: -.05em; }
  .leg { font: 600 24px/1.25 var(--fonte-texto); color: var(--suave); }
  .c.cor .leg { color: rgba(255,255,255,.78); }
</style></head>
<body><div class="peca">
  <div class="area" style="bottom:auto">
    <div class="fila entre"><img class="logo" src="logo.png" alt=""><span class="tag">Por que a gente</span></div>
    <h1 class="display d-m" style="margin-top:44px;max-width:860px">Seu site vendendo enquanto você dorme.</h1>
  </div>
  <div class="grade">
    <div class="c foto-c"><img src="foto.jpg" alt=""></div>
    <div class="c cor"><span class="big">7 dias</span><span class="leg">do briefing ao site no ar</span></div>
    <div class="c"><span class="big">100%</span><span class="leg">pensado para o celular</span></div>
    <div class="c"><span class="big">24h</span><span class="leg">captando contatos no WhatsApp</span></div>
  </div>
</div></body></html>
